# Weekly check that every lecture model and script still works with the
# latest R and the latest versions of the course packages.
# GitHub emails you when a run fails.

name: course-check

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"     # every Monday, 05:17 UTC
  workflow_dispatch:          # adds a "Run workflow" button on GitHub

jobs:
  check:
    name: R ${{ matrix.r }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r: [release, devel]
    # R-devel is an early warning for the next R version; it may fail without
    # marking the whole run as failed.
    continue-on-error: ${{ matrix.r == 'devel' }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true                   # also run the lecture-script tests
      _R_CHECK_FORCE_SUGGESTS_: false  # countreg (R-Forge) is optional

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true        # prebuilt binaries: fast installs

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::jsonlite
          needs: check

      - name: Install countreg from R-Forge (optional)
        continue-on-error: true
        shell: Rscript {0}
        run: |
          install.packages("countreg",
            repos = c("https://R-Forge.R-project.org", getOption("repos")))

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"error"'          # CRAN-style warnings/notes don't fail the run
